[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-authority"
version = "0.1.0"
description = "The reference implementation of agent authority: verifiable, scoped, revocable mandates for AI agents in five verbs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
keywords = ["agent", "authority", "delegation", "capability", "mandate", "mcp", "a2a", "authorization", "ai"]
dependencies = []

# Optional natives. The core is dependency-free; install an extra to enable a
# constant-time Ed25519 backend and sealed credentials (both use `cryptography`).
[project.optional-dependencies]
seal = ["cryptography>=41"]
fast = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/novaai0401-ui/agent-authority"
Repository = "https://github.com/novaai0401-ui/agent-authority"
Issues = "https://github.com/novaai0401-ui/agent-authority/issues"

[project.scripts]
agent-authority = "agent_authority.cli:main"
agent-authority-mcp = "agent_authority.mcp_server:main"
agent-authority-control-plane = "agent_authority.control_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_authority"]
