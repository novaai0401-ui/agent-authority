[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-authority"
version = "0.1.5"
description = "Authorization for AI agents: verifiable, scoped, revocable capability tokens (mandates) with attenuable delegation, for MCP and A2A. The reference implementation of agent authority — zero-dependency TypeScript & Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
]
keywords = [
    "agent-authority", "agent", "authority", "authorization", "ai-agents",
    "agentic", "llm", "delegation", "capability", "capability-tokens",
    "capability-based-security", "least-privilege", "mandate", "macaroons",
    "biscuit", "oauth", "on-behalf-of", "spiffe", "ed25519", "revocation",
    "mcp", "a2a", "permissions",
]
dependencies = []

# Optional natives. The core is dependency-free; install an extra to enable a
# constant-time Ed25519 backend and sealed credentials (both use `cryptography`).
[project.optional-dependencies]
seal = ["cryptography>=41"]
fast = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/novaai0401-ui/agent-authority"
Repository = "https://github.com/novaai0401-ui/agent-authority"
Issues = "https://github.com/novaai0401-ui/agent-authority/issues"

[project.scripts]
agent-authority = "agent_authority.cli:main"
agent-authority-mcp = "agent_authority.mcp_server:main"
agent-authority-control-plane = "agent_authority.control_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_authority"]
