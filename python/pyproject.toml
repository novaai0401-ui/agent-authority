[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behalf"
version = "0.1.0"
description = "The reference implementation of agent authority: verifiable, scoped, revocable mandates for AI agents in five verbs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "PolyForm Strict License 1.0.0 (SEE LICENSE)" }
classifiers = ["License :: Other/Proprietary License"]
keywords = ["agent", "authority", "delegation", "capability", "mandate", "mcp", "a2a", "authorization", "ai"]
dependencies = []

[project.urls]
Homepage = "https://github.com/novaai0401-ui/agent-authority"
Repository = "https://github.com/novaai0401-ui/agent-authority"
Issues = "https://github.com/novaai0401-ui/agent-authority/issues"

[project.scripts]
behalf = "behalf.cli:main"
behalf-mcp = "behalf.mcp_server:main"
behalf-control-plane = "behalf.control_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["behalf"]
