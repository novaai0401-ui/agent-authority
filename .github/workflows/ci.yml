name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run examples

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (stdlib only, no deps)
        working-directory: python
        run: python -m unittest discover -s tests -v

  python-native:
    name: Python native crypto backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pip: cryptography, backend: cryptography }
          - { pip: pynacl, backend: pynacl }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Ed25519 backend
        run: python -m pip install ${{ matrix.pip }}
      - name: Run Python suite under the native backend
        working-directory: python
        env:
          BEHALF_EXPECT_BACKEND: ${{ matrix.backend }}
        run: python -m unittest discover -s tests -v
      - name: Cross-language interop with the native backend
        # Proves the native signer is byte-compatible with the Node port.
        run: npm ci && npm run test:interop

  interop:
    name: Cross-language wire interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:interop
