name: Release

# Build, test, and package both ports. Publishing is gated: it only happens on a
# version tag (v*) AND when the relevant token secret is configured — otherwise
# every run is a safe dry-run, so the workflow is exercised on demand without
# ever publishing by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    name: npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack (always) and publish (tag + token only)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          npm pack
          if [ "$HAS_TOKEN" = "true" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Publishing to npm…"
            npm publish --provenance --access public
          else
            echo "Dry-run (no NPM_TOKEN or not a tag):"
            npm publish --dry-run
          fi

  pypi:
    name: PyPI package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: twine check dist/*
      - name: Publish (tag + token only)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          HAS_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Publishing to PyPI…"
            twine upload dist/*
          else
            echo "Dry-run (no PYPI_TOKEN or not a tag); package validated by twine check."
          fi
