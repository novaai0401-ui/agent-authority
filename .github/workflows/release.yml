name: Release

# Build, test, and package both ports. Publishing is gated: it only happens on a
# version tag (v*) AND when the relevant token secret is configured — otherwise
# every run is a safe dry-run, so the workflow is exercised on demand without
# ever publishing by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    name: npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack (always) and publish (tag + token only; idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          npm pack
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agent-authority@$VERSION" version >/dev/null 2>&1; then
            echo "agent-authority@$VERSION is already on npm — skipping publish."
          elif [ "$HAS_TOKEN" = "true" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Publishing to npm…"
            npm publish --provenance --access public
          else
            echo "Dry-run (no NPM_TOKEN or not a tag):"
            npm publish --dry-run
          fi

  pypi:
    name: PyPI package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test + build + validate (always)
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m unittest discover -s tests
          python -m build
          twine check dist/*
      # Publishes only on a version tag, via Trusted Publishing. Configure a PyPI
      # "pending publisher" first (owner: novaai0401-ui, repo: agent-authority,
      # workflow: release.yml); this works even though the project doesn't exist
      # yet, and needs NO PYPI_TOKEN secret. See README "Publishing".
      - name: Publish to PyPI (tag or manual dispatch)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
